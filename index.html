<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="WatchTower is an interactive country intelligence atlas covering demographics, economics, government, health, crime, migration, and security."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://watchtower.app/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WatchTower" />
    <meta property="og:title" content="WatchTower" />
    <meta
      property="og:description"
      content="An interactive country intelligence atlas covering demographics, economics, government, health, crime, migration, and security."
    />
    <meta property="og:url" content="https://watchtower.app/" />
    <title>WatchTower</title>
    <script>
      (() => {
        const storageKey = 'wt-theme';
        const root = document.documentElement;
        let theme = null;

        try {
          theme = localStorage.getItem(storageKey);
        } catch {
          theme = null;
        }

        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }

        root.setAttribute('data-theme', theme);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
